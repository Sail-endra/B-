<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>B+</title>
  <style>
    body {
      width: 310px;
      margin: 0;
      padding: 16px;
      font: 13px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202124;
      background: #fff;
    }
    h1 { margin: 0 0 5px; font-size: 16px; }
    p { margin: 0 0 12px; color: #5f6368; }
    #site {
      margin: 10px 0 12px;
      padding: 9px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      overflow-wrap: anywhere;
      font-size: 12px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 10px 12px;
      background: #2a6fb0;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #f1f3f4;
      color: #202124;
    }
    button:disabled { opacity: .55; cursor: default; }
    #status { margin-top: 10px; min-height: 18px; font-size: 12px; }
    .ok { color: #137333; }
    .error { color: #b3261e; }
    .small { font-size: 11px; }
  </style>
</head>
<body>
  <h1>B+</h1>
  <p>Enable this only while you're on your Blackboard site.</p>
  <div id="site">Checking current tab…</div>
  <button id="toggle" disabled>Enable on this Blackboard</button>
  <button id="copilot" class="secondary" type="button">Connect AI Lookup Chat</button>
  <div id="copilot-status" class="small" role="status"></div>
  <div id="status"></div>
  <p class="small">Blackboard access is granted to this site only. AI Lookup Chat connects only to this computer at 127.0.0.1:8471.</p>
  <script src="popup.js"></script>
</body>
</html>
